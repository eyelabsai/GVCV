<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fellowship — Month 1 | Gurpal Virdi, MD</title>
    <meta name="robots" content="noindex">
    <!-- Open Graph (social preview) -->
    <meta property="og:title" content="Refractive Surgery Fellowship — Month 1">
    <meta property="og:description" content="Cataract, EVO ICL & LASIK volume from month one of fellowship. De-identified aggregate data.">
    <meta property="og:image" content="https://gurpalvirdi.com/og-image.jpg">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#35476b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:radial-gradient(1200px 700px at 50% -5%, #4a6091 0%, #35476b 40%, #263450 100%);
            color:#eef2f8; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem;
        }
        .card{width:100%; max-width:900px}
        .head{text-align:center; margin-bottom:2rem}
        .eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#88c0d0}
        h1{font-size:2.4rem;font-weight:800;margin:.4rem 0 .3rem;letter-spacing:-.02em}
        .who{color:#9fb0c8;font-size:1rem;font-weight:500}

        .hero{text-align:center;margin:1.5rem 0 1.5rem}
        .hero .big{font-size:3.6rem;font-weight:800;line-height:1;background:linear-gradient(180deg,#a3be8c,#88c0d0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .hero .lbl{font-size:.9rem;color:#9fb0c8;font-weight:600;letter-spacing:.05em;margin-top:.35rem;text-transform:uppercase}

        .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.5rem 0 1.75rem}
        @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
        .kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:1.4rem 1rem;text-align:center;backdrop-filter:blur(8px)}
        .kpi .n{font-size:2.7rem;font-weight:800;line-height:1;color:#fff}
        .kpi .n.eyes{background:linear-gradient(180deg,#c8e6a8,#9fd8e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .kpi .n.green{color:#b7d69a}.kpi .n.cyan{color:#9fd8e6}.kpi .n.gold{color:#f0d68f}
        .kpi .l{font-size:.82rem;color:#9fb0c8;margin-top:.45rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

        .panels{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        @media(max-width:640px){.panels{grid-template-columns:1fr}}
        .panel{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:1.3rem 1rem;backdrop-filter:blur(8px)}
        .panel h2{font-size:.95rem;font-weight:600;margin-bottom:.6rem;text-align:center;color:#cfd9e8}
        .chart-box{position:relative;height:240px;margin:0 auto}
        footer{margin-top:1.5rem;text-align:center;color:#6b7a92;font-size:.78rem;line-height:1.5}
        .err{background:rgba(208,135,112,.15);border-radius:12px;padding:1rem;color:#e0a58f}
    </style>
</head>
<body>
    <div id="gate" style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center">
        <div style="text-align:center;max-width:320px;padding:2rem 1.5rem;background:rgba(255,255,255,.08);
             border:1px solid rgba(255,255,255,.14);border-radius:18px;backdrop-filter:blur(8px)">
            <div style="font-size:1.6rem;margin-bottom:.5rem">🔒</div>
            <div style="font-weight:600;margin-bottom:1.1rem;color:#eef2f8">Enter PIN to view</div>
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"
                   style="width:100%;padding:.7rem;text-align:center;font-size:1.3rem;letter-spacing:.3em;
                          border:1px solid rgba(255,255,255,.2);border-radius:10px;outline:none;background:rgba(0,0,0,.2);color:#fff;font-family:inherit">
            <div id="pinerr" style="height:1.1rem;margin-top:.5rem;font-size:.8rem;color:#e0a58f"></div>
            <button id="pinbtn" style="width:100%;padding:.65rem;margin-top:.3rem;border:none;border-radius:10px;
                    background:#5e81ac;color:#fff;font-weight:600;font-size:.95rem;cursor:pointer;font-family:inherit">Unlock</button>
        </div>
    </div>
    <div class="card" style="display:none">
        <div class="head">
            <div class="eyebrow">Refractive &amp; Cataract Surgery Fellowship</div>
            <h1>Month One</h1>
            <div class="who">Gurpal Virdi, MD · Parkhurst NuVision, San Antonio</div>
        </div>
        <div id="app"></div>
        <footer>
            De-identified aggregate surgical data · no patient information shown.<br>
            Updated <span id="gen">—</span>
        </footer>
    </div>

    <script>
    Chart.register(ChartDataLabels);
    Chart.defaults.font.family="'Inter',sans-serif";
    Chart.defaults.color='#cfd9e8';
    const PAL=['#5e81ac','#a3be8c','#88c0d0','#ebcb8b','#b48ead','#d08770'];

    // ---- Soft PIN gate (de-identified aggregate data only) ----
    const PIN='4170';
    function unlock(){
        document.getElementById('gate').style.display='none';
        document.querySelector('.card').style.display='';
        loadStats();
    }
    (function gate(){
        if(sessionStorage.getItem('trk_ok')==='1'){ unlock(); return; }
        var inp=document.getElementById('pin'), err=document.getElementById('pinerr'), btn=document.getElementById('pinbtn');
        function tryPin(){
            if(inp.value===PIN){ sessionStorage.setItem('trk_ok','1'); unlock(); }
            else { err.textContent='Incorrect PIN'; inp.value=''; inp.focus(); }
        }
        btn.addEventListener('click',tryPin);
        inp.addEventListener('keydown',function(e){ if(e.key==='Enter') tryPin(); });
        inp.focus();
    })();

    function loadStats(){
    fetch('stats.json?v='+Date.now()).then(r=>r.json()).then(s=>{
        document.getElementById('gen').textContent=s.generated;
        const t=s.totals;
        const proc=s.procedure||{};
        const icl=proc['EVO ICL']||0;
        const lasik=proc['LASIK / Refractive']||proc['LASIK']||0;
        const cat=proc['Cataract']||0;

        const refr=icl+lasik;
        const total=Object.values(proc).reduce((a,b)=>a+b,0);
        const other=total-cat-refr;

        document.getElementById('app').innerHTML=
          `<div class="kpis">
             <div class="kpi"><div class="n eyes">${t.eyes}</div><div class="l">Eyes Operated</div></div>
             <div class="kpi"><div class="n gold">${t.premium_pct}%</div><div class="l">Premium IOLs</div></div>
             <div class="kpi"><div class="n cyan">${icl}</div><div class="l">EVO ICL</div></div>
             <div class="kpi"><div class="n green">${lasik}</div><div class="l">LASIK</div></div>
           </div>
           <div class="panels">
             <div class="panel"><h2>Case Types</h2><div class="chart-box"><canvas id="mix"></canvas></div></div>
             <div class="panel"><h2>Refractive Procedures</h2><div class="chart-box"><canvas id="ref"></canvas></div></div>
           </div>`;

        function pctLabel(v, ctx){
            var tot = ctx.dataset.data.reduce(function(a,b){return a+b;}, 0);
            return (100*v/tot) >= 8 ? v : '';
        }
        function D(cv, labels, data, colors){
            new Chart(cv, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 3, borderColor: '#263450' }] },
                options: {
                    maintainAspectRatio: false,
                    cutout: '56%',
                    layout: { padding: 6 },
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#cfd9e8', padding: 12, font: { size: 12, weight: '600' } } },
                        datalabels: { color: '#fff', font: { weight: '800', size: 15 }, formatter: pctLabel }
                    }
                }
            });
        }

        D(mix, ['Cataract','Refractive','Other'], [cat,refr,other], ['#5e81ac','#88c0d0','#4c566a']);
        D(ref, ['EVO ICL','LASIK'], [icl,lasik], ['#88c0d0','#a3be8c']);
    }).catch(e=>{document.getElementById('app').innerHTML='<div class="err">Could not load stats.</div>'});
    }
    </script>
</body>
</html>
